name: 'Store Universal Cache'
description: 'Stores the Universal Cache (Artifact Cache + Setup Cache) to Develocity Edge'

inputs:
  artifact-name:
    description: 'Name for the uploaded Universal Cache log artifact'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Store to Universal Cache
      if: success()
      id: store_cache
      continue-on-error: true
      shell: bash
      run: $ARTIFACT_CACHE_CMD store $ARTIFACT_CACHE_CMD_OPTS

    - name: Warn on Cache Store Failure
      if: steps.store_cache.outcome == 'failure'
      shell: bash
      run: 'echo "WARNING: Failed to store in the Universal Cache."'

    - name: Persist Universal Cache Logs
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: '~/.develocity/artifact-cache/artifact-cache.log'
        retention-days: 7
